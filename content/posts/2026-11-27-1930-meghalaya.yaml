caption: |-
  Meghalaya 5-day budget itinerary from Guwahati: Shillong, Sohra, Nongriat root bridge, Dawki and Mawlynnong 💸
  Flying from Delhi? Guwahati is ₹3,500–5,000 one way if you book early, ₹5,500–7,500 at typical fares. Fares go up in the December holidays, so book now ✈️
  Food runs about ₹400–600 a day if you eat local: jadoh ₹80–120, momos ₹40–80 a plate.
  The Umngot is clearest from November to March, and November is rated exceptional. Boat prices vary by operator and time of day, so get there early 🚣
  Before you go: check the June 2025 guide rule is still in force. A "virtual ILP" (visitor registration) was proposed in July 2026 but wasn't in force in the latest reports. Carry photo ID because homestays must register guests. Renting a car to drive yourself is banned.
  Mawsmai Cave fees and the Shillong–Sohra shared fare differ between sources, so keep a little extra cash.
  Planning this trip? DM us "TRIP"
