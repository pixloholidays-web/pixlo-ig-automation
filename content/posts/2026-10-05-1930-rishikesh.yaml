caption: |-
  Rishikesh trip budget from Delhi: 2N/3D with Shivpuri rafting, October 2026 ka poora kharcha 🌊
  Rafting season 23 Sept 2026 ko khula, 45-day temporary licences pe. 26 Sept ko weather ki wajah se thodi der ruka tha, toh operator se ek din pehle confirm karo.
  Early October mein sirf 9 km aur 16 km stretches chal sakte hain. 26 km aur 35 km usually mid-October tak khulte hain. Rafting roughly 8 AM–2 PM.
  October peak season hai: rates firm, weekends crowded. Weekday jao, discount ka chance zyada.
  GoPro video ₹1,000–1,200 extra per raft. Scooter ₹300–500/day, autos ₹50–200.
  Bus: UTC ₹420 se, UPSRTC Volvo around ₹726. Fares demand pe badalte hain, travel ke paas check karo.
  Bungee: Jumpin Heights, Mohan Chatti, 83 m, around ₹3,550 (video + transport ke saath ₹4,200–4,500), age 12–60 🪂
  Plan banana hai? "TRIP" DM karo
