caption: |-
  McLeodganj and Triund 3-day itinerary from Delhi, with the Triund check-post cutoff and real costs 🏔️

  Triund day hikers are turned back at Gallu Devi after 11:30 AM, sometimes 11:00 AM. So Triund goes on the morning of Day 2, not the day you arrive.
  From Gallu Devi it is 5.5 km one way. A taxi there is ₹400–500, and the descent takes 2–3 hours.
  The forest fee is ₹100 in one source and ₹100–200 in others. Carry ₹200 in cash.
  October is the best window for Triund, with clear post-monsoon skies. It is also peak season, so weekend dorms cost more and need booking 2–3 weeks ahead.
  The Skyway ropeway is quoted at ₹300–500 one way and runs only 9:30 AM–6:00 PM. It was suspended in August 2025 after a landslide, so confirm it is running on the day 🚡
  Budget note: ₹4,300–8,100 is our own total of bus, dorm and Triund costs. It assumes the return bus costs the same as the outbound one, and leaves out meals and the ropeway. Our sources had no return bus timings, so check those when you book 🚌
  Camping at the top is capped at 20 tents and 40 people and the rules change. Check locally before planning a night up there.

  Planning this trip? DM us "TRIP"
