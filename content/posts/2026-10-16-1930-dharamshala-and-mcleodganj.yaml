topic: 'McLeodganj + Triund in 3 days from Delhi, hour by hour: the order that gets you past Triund''s 11:30 AM check-post cutoff. Night 0 overnight bus from Delhi (₹1,000–1,800), Day 1 Dalai Lama temple + kora + Bhagsu waterfall on foot, Day 2 Triund day hike (about ₹900–1,700 all-in), Day 3 Naddi + Skyway ropeway down + night bus back. Sourced core costs: buses both ways ₹2,000–3,600, two dorm nights ₹1,400–2,800, Triund day ₹900–1,700, so about ₹4,300–8,100 per person before meals and the optional ropeway.'
