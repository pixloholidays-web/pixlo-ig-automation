caption: |-
  Kashmir chinar season by train: Delhi to Srinagar on two Vande Bharats, then a 3-day Srinagar chinar trail 🍂
  The fare breakdown: ₹1,630 + ₹715 going, ₹1,570 + ₹715 coming back. The Delhi–Katra fares are 2019 launch figures, so confirm on IRCTC.
  Delhi–Katra (22439) runs six days a week. Katra–Srinagar reportedly skips Tuesdays, and same-day connections are tight, so plan a night in Katra 🚆
  A shikara for a full 6-hour day is ₹2,700 on the 2023 rate card. Ghat to Hazratbal is fixed at ₹1,400.
  Gulmarg gondola: Phase 1 about ₹700–900, Phase 2 about ₹900–1,100. Pony rides cost ₹500–1,500 and are cash only.
  Budget guesthouses run ₹1,000–3,000 a night, and dhaba food ₹500–1,000 a day. Got a spare day? Pahalgam is 90 km away, with Betaab and Aru turning gold in October.
  Go soon: higher areas can get snow by late November. A direct Delhi–Srinagar sleeper is planned but not running yet ❄️
  Planning this trip? DM us "TRIP"
