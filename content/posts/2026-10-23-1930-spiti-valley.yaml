caption: |-
  Spiti Valley in late October: 7 first-timer mistakes, and the Shimla–Kinnaur bus route that still gets you in 🏔️
  The HRTC fares: Delhi (Kashmiri Gate) to Shimla overnight ₹450–550 ordinary (₹900–1,100 AC Volvo), Shimla to Reckong Peo about ₹420, Reckong Peo to Kaza about ₹450 on the 6:30 AM bus. That's about ₹1,320–1,420 on ordinary buses 🚌
  Shimla to Peo is around 230 km (8–10 hrs) and Peo to Kaza around 200 km (9–11 hrs). Keep 1–2 buffer days for altitude or road closures.
  Village homestays run about ₹600–900 a night with dinner and breakfast. BSNL works best out there. Local buses from Kaza go to Langza, Hikkim and Komic for ₹30–50.
  Skip alcohol at altitude: it dehydrates you and can hide AMS symptoms, and the nearest proper hospitals are hours away in Reckong Peo or Manali.
  ⚠️ As of 22 Oct 2026: treat Chandratal as likely closed, and snow can shut Kunzum without warning. Check the Lahaul & Spiti road update 24–48 hours before you leave and again that morning. Bus times and fares come from blogs, not an official HRTC timetable, so confirm them at the counter. SADA fees are approximate.
  Planning this trip? DM us "TRIP"
