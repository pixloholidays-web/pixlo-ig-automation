caption: |-
  Offbeat Darjeeling in November: 4 hamlets with Kanchenjunga views, orange orchards and homestays with meals 🏔️🍊
  Chatakpur's last 14–15 km is rough and boulder-strewn, so book a high-clearance Sumo (about ₹3,200 from Darjeeling, a March 2022 fare). Homestays there run about ₹1,700 per person with all meals.
  Lamahatta, Takdah and Gumbadara can all be done from one base. Some of Takdah's British-era buildings are now heritage homestays.
  In Sittong, walk 150 m uphill to Ahaldara Viewpoint for a 360-degree view.
  Tinchuley tip: the viewpoints are reliable, but not every homestay room faces Kanchenjunga. Ask before you book.
  Getting there: a shared jeep from NJP to Darjeeling is about ₹200–300, more in peak periods.
  Prices mix current listings and older guide pages, so confirm with your homestay. Mountain views need clear weather, and November nights are cold, so pack warm layers 🧥
  Planning this trip? DM us "TRIP"
