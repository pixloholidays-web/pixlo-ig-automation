caption: |-
  Tirthan Valley in October: Serolsar Lake, Chehni Kothi, Sharchi and Chhoie waterfall, with real costs from Delhi 🏔️

  About 511 km from Delhi, 10-12 hours by road. Take a Friday evening bus at 5:30-7:30 PM and you reach Aut around 6 AM.
  In autumn Jalori Pass has the year's best visibility and coloured foliage 🍂
  For a small upgrade, riverside cottages are ₹2,000-4,000 a night.
  Avoid July-August: the Serolsar trail gets slippery and landslides are possible.
  Note: fares are from August 2026 guides and can rise in the Dussehra/Diwali rush. Check Jalori Pass road status locally before you go ❄️

  Planning this trip? DM us "TRIP"
