caption: |-
  Tirthan Valley in October: Serolsar Lake, Chehni Kothi, Sharchi aur Chhoie waterfall, Delhi se real costs ke saath 🏔️

  Delhi se about 511 km, 10-12 ghante by road. Friday shaam 5:30-7:30 PM ki bus pakdo, Aut subah 6 AM ke aaspaas.
  Autumn mein Jalori Pass pe saal ki best visibility aur coloured foliage milti hai 🍂
  Thoda upgrade chahiye toh riverside cottages ₹2,000-4,000 a night.
  July-August avoid karo: Serolsar trail slippery hota hai, landslides possible.
  Note: fares August 2026 ke guides se hain, Dussehra/Diwali rush mein badh sakte hain. Jalori Pass ka road status jaane se pehle locally check karo ❄️

  Plan banana hai? "TRIP" DM karo
