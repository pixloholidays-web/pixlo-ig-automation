# Daily: research + render carousels for the next 2 days' slots. Post text is committed straight to main;
# slides and Reels go to the media branch until they are published.
# No PR approval step: quality gates (pixlo/quality.py) decide. Set `paused: true` in config.yaml to stop.
name: Generate posts

on:
  schedule:
    - cron: "30 0 * * *"        # 06:00 IST
  workflow_dispatch:
    inputs:
      days:
        description: "Days ahead to plan"
        default: "2"

permissions:
  contents: write

concurrency:                     # one job at a time may change the repo or the media branch
  group: repo-writes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Cache depth model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-anything-v2-small

      - name: Fetch unpublished media
        run: python cli.py media-pull

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate carousels
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # from `claude setup-token`
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        # A slot that fails the quality gates is skipped and the run fails, so GitHub emails you
        run: python cli.py plan --days "${{ github.event.inputs.days || '2' }}"

      - name: Validate
        if: always()
        run: python cli.py validate

      - name: Commit new posts
        if: always()
        run: |
          git config user.name "pixlo-bot"
          git config user.email "pixlo-bot@users.noreply.github.com"
          git add content/posts assets/music/library.yaml
          if ! git diff --cached --quiet; then
            git commit -m "content: new carousels [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Upload new slides and Reels to the media branch
        if: always()
        run: python cli.py media-sync
