# Publish approved posts on main whose time has come.
name: Publish due posts

on:
  schedule:
    # Every 20 minutes. GitHub delays or drops scheduled runs when it is busy, so frequent runs keep posts
    # close to their time. Each run takes about a minute and is free on a public repo.
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:                     # never run two publishers at once
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch unpublished media
        run: python cli.py media-pull

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: python cli.py publish

      - name: Commit status updates
        if: always()             # record container ids / errors even when a post fails
        run: |
          git config user.name "pixlo-bot"
          git config user.email "pixlo-bot@users.noreply.github.com"
          git add content/posts
          if ! git diff --cached --quiet; then
            git commit -m "chore: update post status [skip ci]"
            git pull --rebase
            git push
          fi

      - name: Delete media of published posts
        if: always()
        run: python cli.py media-sync
