# Manual: confirm the Instagram token works (prints the account name and publishing quota, never the token).
# Give a post id to also rehearse its upload: Instagram fetches and processes the files, nothing is published.
name: Check Instagram connection

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Post id to rehearse uploading (nothing is published). Empty = only check the token"
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Who am I
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python cli.py whoami
      - name: Rehearse upload (no publish)
        if: github.event.inputs.post != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POST_ID: ${{ github.event.inputs.post }}
        run: |
          python cli.py media-pull
          python cli.py test-upload "$POST_ID"
